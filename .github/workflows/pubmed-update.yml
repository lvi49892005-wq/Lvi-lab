name: PubMed 논문 자동 확인

on:
  schedule:
    # 3개월마다 (1월·4월·7월·10월 1일 09:17 KST = 00:17 UTC)
    - cron: "17 0 1 1,4,7,10 *"
  workflow_dispatch: {}   # Actions 탭에서 'Run workflow' 버튼으로 수동 실행

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: PubMed 확인
        id: pubmed
        env:
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
        run: python scripts/update_pubmed.py

      - name: 확인용 Pull Request 만들기
        if: steps.pubmed.outputs.added != '0'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: auto/pubmed-update
          commit-message: "PubMed 새 논문 ${{ steps.pubmed.outputs.added }}편 추가 (자동)"
          title: "PubMed 새 논문 ${{ steps.pubmed.outputs.added }}편 — 확인 후 Merge 해 주세요"
          body: |
            ${{ steps.pubmed.outputs.summary }}

            ---
            **확인 방법**
            1. 위 목록이 교수님 논문이 맞는지 확인합니다. 아니면 이 PR을 닫고 해당 PMID를 `data/pubmed-exclude.txt`에 추가하세요.
            2. 교신저자 논문이면 **Files changed** 탭에서 연필 아이콘으로 `Nam JH` 뒤에 `*`를 붙여 주세요.
            3. 문제가 없으면 **Merge pull request** 를 누르면 1~2분 뒤 홈페이지에 반영됩니다.
          delete-branch: true
